<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fija el tema antes del primer pintado para evitar el parpadeo blanco. -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem("tema");
          var oscuro =
            guardado === "dark" ||
            (guardado !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", oscuro ? "dark" : "light");
        } catch (e) {
          /* Sin localStorage (modo privado): se queda el tema claro por defecto. */
        }
      })();
    </script>

    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />

    <title>Víctor Prim Romero — Desarrollador fullstack · IA aplicada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
